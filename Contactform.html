<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact form</title>
    <style>
        

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px;
    font-family: Arial, sans-serif;
    background-color: rgb(231, 250, 220);
}




.contact-container {
    background-color: white;
    max-width: 650px;
    margin: 20px auto;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 3px 15px rgba(0, 0, 0, 0.2);
}


.contact-container h1 {
    text-align: center;
    color:rgb(0, 128, 0);
    font-size: 30px;
}

.contact-container h2 {
    text-align: center;
    color: rgb(0, 128, 0);
    font-size: 27px;
}

.contact-container > p {
    text-align: center;
    color:rgb(70, 70, 70);
    margin-bottom: 30px;
}



form label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    color: rgb(0, 128, 0);
    font-weight: bold;
}




form input,
form textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid rgb(223, 221, 221);
    border-radius: 6px;
    font-size: 15px;
    font-family: Arial, sans-serif;
}



form input:focus,
form textarea:focus {
    outline: none;
    border: 2px solid rgb(123, 68, 2);
}




form textarea {
    resize: vertical;
}




form button {
    display: block;
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    background-color:rgb(0, 128, 0);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 17px;
    cursor: pointer;
}




.contact-info {
    background-color:rgb(250, 211, 152);
    margin-top: 30px;
    padding: 20px;
    border-radius: 8px;
}

.contact-info h3 {
    color: rgb(0, 128, 0);
    text-align: center;
}

.contact-info p {
    color: #333;
    font-size: 15px;
}




.back-link {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: rgb(0, 128, 0);
    font-weight: bold;
}



    </style>
</head>
<body>
    <form>
        <br>
        <label for="Name">Name:</label>
        <input name="Name" id="uname" type="text" placeholder="Enter your name here">
        <br>
        <br>
        <label for="uemail">User Email:</label>
        <input name="email" id="uemail" type="email">
        <br>
        <br>
        <label for="phno">Phone No:</label>
        <input name="tel" id="tel" type="tel">

        <br>

        <label for="g">Gender:</label>
        <input type="radio" name="gender"  id="g" value="Female">Female
        <input type="radio" name="gender" value="Male" id="g">Male

        <br>

        <br>
<label for="comments">Comments</label>
        <textarea name="comments" id="comments">

        </textarea>


        <button>Submit</button>
    </form>
</body>
</html>
